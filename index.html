<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sagan Tracker</title>
<meta name="theme-color" content="#6C63FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sagan Tracker">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#f0f0f8;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:430px;background:#f0f0f8;min-height:100vh;display:flex;flex-direction:column}

/* TOP BAR */
.topbar{background:#fff;padding:16px 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 #efefef}
.topbar-title{font-size:22px;font-weight:700;color:#1a1a2e}
.topbar-actions{display:flex;gap:10px;align-items:center}
.tb-btn{width:38px;height:38px;border-radius:50%;border:none;background:#f0f0f8;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#6C63FF}
.tb-btn.add{background:#6C63FF;color:#fff;font-size:24px;font-weight:300;box-shadow:0 4px 12px rgba(108,99,255,0.35)}

/* SCREENS */
.screen{display:none;flex:1;overflow-y:auto;padding-bottom:20px}
.screen.active{display:block}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 0}
.stat-box{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden}
.stat-box.recv{background:linear-gradient(135deg,#6C63FF,#8B85FF)}
.stat-box.give{background:linear-gradient(135deg,#A855F7,#C084FC)}
.stat-box::after{content:'';position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,0.1)}
.sb-icon{font-size:20px;margin-bottom:6px;opacity:0.9}
.sb-label{font-size:12px;opacity:0.85;font-weight:500;margin-bottom:6px}
.sb-val{font-size:28px;font-weight:700;letter-spacing:-0.5px}

/* PILLS */
.pills{display:flex;gap:10px;padding:12px 16px 0}
.pill{flex:1;background:#fff;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 1px 4px rgba(108,99,255,0.08)}
.pill .pnum{font-size:22px;font-weight:700;color:#1a1a2e}
.pill .plbl{font-size:11px;color:#888;margin-top:2px}

/* SECTION */
.sec-title{font-size:14px;font-weight:600;color:#1a1a2e;padding:18px 16px 10px}

/* CARDS */
.card{background:#fff;border-radius:16px;padding:14px 16px;margin:0 16px 10px;cursor:pointer;box-shadow:0 1px 4px rgba(108,99,255,0.08)}
.card:active{opacity:0.95;transform:scale(0.99)}
.card-row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.card-name{font-size:15px;font-weight:600;color:#1a1a2e;flex:1;margin-right:8px}
.card-amount{font-size:16px;font-weight:700;white-space:nowrap}
.card-amount.recv{color:#6C63FF}
.card-amount.give{color:#A855F7}
.card-row2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.card-sub{font-size:12px;color:#888}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
.badge.recv{background:#EEF0FF;color:#6C63FF}
.badge.give{background:#F5EEFF;color:#A855F7}
.badge.tag{background:#f0f0f8;color:#888}
.evbadge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;background:#EEF0FF;color:#6C63FF}
.card-expand{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #f5f5f5;font-size:12px;color:#888}
.card-expand.open{display:block}
.del-btn{margin-top:8px;background:#FFF0F0;border:1px solid #ffd0d0;color:#e53e3e;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:#bbb;background:#fff;border-radius:16px;margin:0 16px;box-shadow:0 1px 4px rgba(108,99,255,0.06)}
.empty-icon{font-size:44px;margin-bottom:12px;opacity:0.35}
.empty p{font-size:13px;line-height:1.6}

/* SEARCH */
.search-box{position:relative;padding:12px 16px 0}
.search-box input{width:100%;border:none;border-radius:14px;padding:11px 14px 11px 40px;font-size:13px;font-family:'Inter',sans-serif;color:#1a1a2e;background:#fff;outline:none;box-shadow:0 1px 4px rgba(108,99,255,0.08)}
.search-box input:focus{box-shadow:0 0 0 2px rgba(108,99,255,0.2)}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:#bbb;font-size:14px;pointer-events:none}

/* CHIPS */
.chips{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:none;background:#fff;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;color:#888;flex-shrink:0;box-shadow:0 1px 3px rgba(108,99,255,0.08)}
.chip.on{background:#6C63FF;color:#fff;box-shadow:0 2px 8px rgba(108,99,255,0.3)}

/* PEOPLE */
.pcard{background:#fff;border-radius:16px;margin:0 16px 10px;overflow:hidden;box-shadow:0 1px 4px rgba(108,99,255,0.08)}
.pc-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pc-name{font-size:15px;font-weight:600;color:#1a1a2e}
.pc-rel{font-size:11px;color:#aaa;margin-top:2px}
.pc-net{font-size:16px;font-weight:700;text-align:right}
.pc-body{display:none;border-top:1px solid #f5f5f5}
.pc-body.open{display:block}
.pc-totals{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #f5f5f5}
.pc-tot{padding:10px 16px;text-align:center}
.ptv{font-size:15px;font-weight:700}
.ptl{font-size:10px;color:#aaa;margin-top:2px}
.pc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid #fafafa;font-size:12px}
.pc-row:last-child{border:none}
.pc-row-left{color:#888;flex:1;margin-right:8px}
.pc-row-right{font-weight:600;white-space:nowrap}

/* EVENTS */
.ecard{background:#fff;border-radius:16px;margin:0 16px 10px;overflow:hidden;box-shadow:0 1px 4px rgba(108,99,255,0.08)}
.ec-head{padding:14px 16px;cursor:pointer}
.ec-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.ec-name{font-size:15px;font-weight:600;color:#1a1a2e}
.ec-date{font-size:11px;color:#aaa}
.ec-stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #f5f5f5}
.ec-stat{padding:10px 8px;text-align:center}
.esv{font-size:13px;font-weight:700}
.esl{font-size:10px;color:#aaa;margin-top:2px}
.ec-body{display:none;border-top:1px solid #f5f5f5}
.ec-body.open{display:block}
.add-event-btn{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;margin:12px 16px;padding:14px 16px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;color:#aaa;font-weight:500;width:calc(100% - 32px);border:2px dashed #d8d8f0;box-shadow:0 1px 4px rgba(108,99,255,0.06)}

/* BOTTOM NAV */
.botnav{background:#fff;border-top:1px solid #efefef;display:flex;height:72px;flex-shrink:0;position:sticky;bottom:0;z-index:50;box-shadow:0 -2px 12px rgba(108,99,255,0.08)}
.nb{flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#bbb;font-family:'Inter',sans-serif;font-weight:500;padding-bottom:4px;transition:color 0.15s}
.nb.on{color:#6C63FF}
.nb svg{width:22px;height:22px;stroke-width:1.8}

/* OVERLAY + SHEET */
.overlay{display:none;position:fixed;inset:0;background:rgba(26,26,46,0.45);z-index:60;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 32px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;background:#e8e8f0;border-radius:2px;margin:0 auto 18px}
.sheet-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:18px}

/* TYPE TOGGLE */
.type-toggle{display:flex;background:#f0f0f8;border-radius:14px;padding:3px;margin-bottom:20px}
.tt-btn{flex:1;border:none;background:transparent;border-radius:12px;padding:11px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:#aaa;transition:all 0.2s}
.tt-btn.recv{background:#6C63FF;color:#fff;box-shadow:0 2px 8px rgba(108,99,255,0.3)}
.tt-btn.give{background:#A855F7;color:#fff;box-shadow:0 2px 8px rgba(168,85,247,0.3)}

/* FORM */
.flabel{display:block;font-size:11px;font-weight:600;color:#aaa;margin-bottom:5px;margin-top:16px;text-transform:uppercase;letter-spacing:0.4px}
.flabel .req{color:#6C63FF}
.finput{width:100%;border:1.5px solid #ececf5;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',sans-serif;color:#1a1a2e;background:#fafafa;outline:none;-webkit-appearance:none;appearance:none;transition:border-color 0.2s}
.finput:focus{border-color:#6C63FF;background:#fff}
textarea.finput{resize:none;min-height:68px}
.sbtn{width:100%;background:linear-gradient(135deg,#6C63FF,#A855F7);color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:22px;box-shadow:0 4px 12px rgba(108,99,255,0.3)}
.cancel-btn{width:100%;border:none;background:transparent;color:#bbb;padding:10px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:4px}

/* SETTINGS */
.set-section{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:0.4px;padding:4px 0 8px}
.set-row{display:flex;align-items:center;gap:12px;background:#fafafa;border-radius:14px;padding:14px 16px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;color:#1a1a2e;font-weight:500;margin-bottom:10px;width:100%;text-align:left;border:none;transition:background 0.15s}
.set-row:active{background:#f0f0f8}
.set-icon{font-size:20px;width:28px;text-align:center}
.set-row-sub{font-size:11px;color:#aaa;margin-top:1px}
.backup-info{background:#f0f0f8;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:12px;color:#666;display:flex;align-items:center;gap:8px}
.backup-dot{width:8px;height:8px;border-radius:50%;background:#ddd;flex-shrink:0}
.backup-dot.fresh{background:#22c55e}
.backup-dot.old{background:#f59e0b}
.confirm-box{background:#f0f0f8;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px;color:#666;line-height:1.5}
.confirm-row{display:flex;gap:8px}
.cy{flex:1;background:#6C63FF;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.cn{flex:1;background:#fff;color:#1a1a2e;border:1.5px solid #e8e8f0;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}

/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
#fileInput{display:none}
</style>
</head>
<body>
<div id="app">
<div class="topbar">
  <div class="topbar-title">Sagan Tracker</div>
  <div class="topbar-actions">
    <button class="tb-btn add" onclick="openAdd()">+</button>
    <button class="tb-btn" onclick="openSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- HOME -->
<div class="screen active" id="s-home">
  <div class="stats-grid">
    <div class="stat-box recv">
      <div class="sb-icon">&#8595;</div>
      <div class="sb-label">Total Received</div>
      <div class="sb-val" id="h-recv">&#8377;0</div>
    </div>
    <div class="stat-box give">
      <div class="sb-icon">&#8593;</div>
      <div class="sb-label">Total Given</div>
      <div class="sb-val" id="h-give">&#8377;0</div>
    </div>
  </div>
  <div class="pills">
    <div class="pill"><div class="pnum" id="h-ent">0</div><div class="plbl">Entries</div></div>
    <div class="pill"><div class="pnum" id="h-ppl">0</div><div class="plbl">People</div></div>
    <div class="pill"><div class="pnum" id="h-evs">0</div><div class="plbl">Events</div></div>
  </div>
  <div class="sec-title">Recent Entries</div>
  <div id="h-list"></div>
</div>

<!-- EVENTS -->
<div class="screen" id="s-events">
  <button class="add-event-btn" onclick="openCreateEvent()">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6C63FF" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>Create New Event</span>
  </button>
  <div id="ev-list"></div>
</div>

<!-- LOG -->
<div class="screen" id="s-log">
  <div class="search-box">
    <span class="search-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" placeholder="Search name, occasion, event..." oninput="rLog()" id="log-q">
  </div>
  <div class="chips" id="lfc">
    <button class="chip on" onclick="setLF('all',this)">All</button>
    <button class="chip" onclick="setLF('Received',this)">Received</button>
    <button class="chip" onclick="setLF('Given',this)">Given</button>
  </div>
  <div class="chips" id="lsc" style="padding-top:4px">
    <button class="chip on" onclick="setLS('newest',this)">Newest</button>
    <button class="chip" onclick="setLS('oldest',this)">Oldest</button>
    <button class="chip" onclick="setLS('high',this)">Amount &#8593;</button>
    <button class="chip" onclick="setLS('low',this)">Amount &#8595;</button>
  </div>
  <div style="margin-top:10px" id="log-list"></div>
</div>

<!-- PEOPLE -->
<div class="screen" id="s-people">
  <div class="search-box">
    <span class="search-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" placeholder="Search person..." oninput="rPeople()" id="ppl-q">
  </div>
  <div class="chips" id="psc">
    <button class="chip on" onclick="setPS('recv',this)">By Received</button>
    <button class="chip" onclick="setPS('give',this)">By Given</button>
    <button class="chip" onclick="setPS('net',this)">By Net</button>
    <button class="chip" onclick="setPS('count',this)">By Times</button>
  </div>
  <div style="margin-top:10px" id="ppl-list"></div>
</div>

<!-- BOTTOM NAV -->
<div class="botnav">
  <button class="nb on" onclick="nav('home',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </button>
  <button class="nb" onclick="nav('events',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Events
  </button>
  <button class="nb" onclick="nav('log',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Log
  </button>
  <button class="nb" onclick="nav('people',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    People
  </button>
</div>
</div>

<!-- ADD ENTRY SHEET -->
<div class="overlay" id="add-overlay" onclick="bgClose(event,'add-overlay')">
<div class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Add Sagan</div>
  <div class="type-toggle">
    <button class="tt-btn recv" id="tt-recv" onclick="setType('Received')">&#8595; Received</button>
    <button class="tt-btn" id="tt-give" onclick="setType('Given')">&#8593; Given</button>
  </div>
  <label class="flabel" id="fl-person">Received From <span class="req">*</span></label>
  <input class="finput" id="f-name" type="text" placeholder="e.g. Ramesh Uncle">
  <label class="flabel">Amount <span class="req">*</span></label>
  <input class="finput" id="f-amt" type="number" min="1" placeholder="e.g. 5100" inputmode="numeric">
  <label class="flabel">Date</label>
  <input class="finput" id="f-date" type="date">
  <label class="flabel">Occasion</label>
  <input class="finput" id="f-occ" type="text" list="ol" placeholder="e.g. Diwali 2024">
  <datalist id="ol"><option value="Diwali"><option value="Holi"><option value="Wedding"><option value="Birthday"><option value="Navratri"><option value="Bhai Dooj"></datalist>
  <label class="flabel">Relationship</label>
  <input class="finput" id="f-rel" type="text" list="rl" placeholder="e.g. Uncle">
  <datalist id="rl"><option value="Uncle"><option value="Aunty"><option value="Neighbour"><option value="Family Friend"><option value="Cousin"><option value="Colleague"></datalist>
  <label class="flabel">Link to Event</label>
  <select class="finput" id="f-ev"><option value="">-- None --</option></select>
  <label class="flabel">Notes</label>
  <textarea class="finput" id="f-notes" placeholder="e.g. Given in envelope" rows="2"></textarea>
  <button class="sbtn" onclick="saveEntry()">Save Entry</button>
  <button class="cancel-btn" onclick="closeSheet('add-overlay')">Cancel</button>
</div>
</div>

<!-- CREATE EVENT SHEET -->
<div class="overlay" id="ev-overlay" onclick="bgClose(event,'ev-overlay')">
<div class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Create Event</div>
  <label class="flabel">Event Name <span class="req">*</span></label>
  <input class="finput" id="ev-name" type="text" placeholder="e.g. Rahul's Wedding">
  <label class="flabel">Date <span class="req">*</span></label>
  <input class="finput" id="ev-date" type="date">
  <label class="flabel">Occasion Type</label>
  <input class="finput" id="ev-type" type="text" list="etl" placeholder="e.g. Wedding">
  <datalist id="etl"><option value="Wedding"><option value="Diwali"><option value="Birthday"><option value="Holi"><option value="Navratri"><option value="Other"></datalist>
  <label class="flabel">Notes</label>
  <textarea class="finput" id="ev-notes" placeholder="Any notes" rows="2"></textarea>
  <button class="sbtn" onclick="saveEvent()">Create Event</button>
  <button class="cancel-btn" onclick="closeSheet('ev-overlay')">Cancel</button>
</div>
</div>

<!-- SETTINGS SHEET -->
<div class="overlay" id="set-overlay" onclick="bgClose(event,'set-overlay')">
<div class="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Settings</div>
  <div class="backup-info" id="backup-status">
    <div class="backup-dot" id="backup-dot"></div>
    <span id="backup-text">No backup yet — back up your data!</span>
  </div>
  <div class="set-section">Backup</div>
  <button class="set-row" onclick="shareBackup()">
    <span class="set-icon">&#128279;</span>
    <div>
      <div>Share Backup</div>
      <div class="set-row-sub">Share .json via WhatsApp, Gmail, Drive etc.</div>
    </div>
  </button>
  <button class="set-row" onclick="exportData()">
    <span class="set-icon">&#128228;</span>
    <div>
      <div>Download Backup</div>
      <div class="set-row-sub">Save .json file to your device</div>
    </div>
  </button>
  <div class="set-section" style="margin-top:4px">Restore</div>
  <div id="set-confirm" style="display:none">
    <div class="confirm-box">This will replace ALL your current data. Are you sure?</div>
    <div class="confirm-row">
      <button class="cy" onclick="doImport()">Yes, Import</button>
      <button class="cn" onclick="cancelImport()">Cancel</button>
    </div>
  </div>
  <div id="set-btns">
    <button class="set-row" onclick="document.getElementById('fileInput').click()">
      <span class="set-icon">&#128229;</span>
      <div>
        <div>Import Backup</div>
        <div class="set-row-sub">Restore from a .json backup file</div>
      </div>
    </button>
    <input type="file" id="fileInput" accept=".json" onchange="onFile(event)">
  </div>
  <button class="cancel-btn" onclick="closeSheet('set-overlay')">Close</button>
</div>
</div>

<script>
var E=JSON.parse(localStorage.getItem('sg_e')||'[]');
var V=JSON.parse(localStorage.getItem('sg_v')||'[]');
var cType='Received',lf='all',ls='newest',ps='recv',imp=null;
var lastBackup=localStorage.getItem('sg_lastbackup')||null;

function save(){localStorage.setItem('sg_e',JSON.stringify(E));localStorage.setItem('sg_v',JSON.stringify(V));}
function rs(n){return '\u20B9'+Number(n).toLocaleString('en-IN');}
function fd(d){if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function daysAgo(ts){var diff=Math.floor((Date.now()-Number(ts))/86400000);return diff===0?'today':diff===1?'yesterday':diff+' days ago';}

function nav(t,btn){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
  document.getElementById('s-'+t).classList.add('active');
  btn.classList.add('on');
  if(t==='home')rHome();
  if(t==='events')rEvents();
  if(t==='log')rLog();
  if(t==='people')rPeople();
}

function rHome(){
  var rc=E.filter(function(e){return e.t==='Received';}).reduce(function(s,e){return s+e.a;},0);
  var gv=E.filter(function(e){return e.t==='Given';}).reduce(function(s,e){return s+e.a;},0);
  document.getElementById('h-recv').textContent=rs(rc);
  document.getElementById('h-give').textContent=rs(gv);
  document.getElementById('h-ent').textContent=E.length;
  document.getElementById('h-ppl').textContent=new Set(E.map(function(e){return e.n.toLowerCase().trim();})).size;
  document.getElementById('h-evs').textContent=V.length;
  var recent=[].concat(E).sort(function(a,b){return new Date(b.d)-new Date(a.d);}).slice(0,3);
  var el=document.getElementById('h-list');
  el.innerHTML=recent.length?recent.map(function(e){return ecard(e,true);}).join(''):'<div class="empty"><div class="empty-icon">&#128235;</div><p>No entries yet<br>Tap + to add your first sagan</p></div>';
}

function ecard(e,mini){
  var ev=V.find(function(v){return v.id===e.ev;});
  var rc=e.t==='Received';
  var meta=[];
  if(e.o)meta.push(e.o);
  if(ev)meta.push('<span class="evbadge">'+ev.n+'</span>');
  if(e.r)meta.push('<span class="badge tag">'+e.r+'</span>');
  return '<div class="card" onclick="tog(\'cx-'+e.id+'\')">'
    +'<div class="card-row1"><span class="card-name">'+e.n+'</span><span class="card-amount '+(rc?'recv':'give')+'">'+rs(e.a)+'</span></div>'
    +'<div class="card-row2"><span class="card-sub">'+(meta.length?meta.join(' &nbsp;'):'')+'</span>'
    +'<span style="display:flex;align-items:center;gap:6px"><span class="badge '+(rc?'recv':'give')+'">'+e.t+'</span><span class="card-sub">'+fd(e.d)+'</span></span></div>'
    +'<div class="card-expand" id="cx-'+e.id+'">'
    +(e.nt?'<div style="margin-bottom:8px">'+e.nt+'</div>':'<div style="margin-bottom:8px;color:#ddd">No notes</div>')
    +(mini?'':'<button class="del-btn" onclick="event.stopPropagation();del(\''+e.id+'\')">Delete</button>')
    +'</div></div>';
}

function tog(id){var el=document.getElementById(id);if(el)el.classList.toggle('open');}

function rEvents(){
  var el=document.getElementById('ev-list');
  if(!V.length){el.innerHTML='<div class="empty"><div class="empty-icon">&#128197;</div><p>No events yet.<br>Create one to group sagans!</p></div>';return;}
  el.innerHTML=V.map(function(v){
    var lk=E.filter(function(e){return e.ev===v.id;});
    var rc=lk.filter(function(e){return e.t==='Received';}).reduce(function(s,e){return s+e.a;},0);
    var gv=lk.filter(function(e){return e.t==='Given';}).reduce(function(s,e){return s+e.a;},0);
    var net=rc-gv;
    return '<div class="ecard"><div class="ec-head" onclick="tog(\'ecb-'+v.id+'\')">'
      +'<div class="ec-top"><div class="ec-name">'+v.n+'</div><div class="ec-date">'+fd(v.d)+'</div></div>'
      +'<div><span class="badge tag">'+(v.tp||'Event')+'</span>&nbsp;<span class="badge tag">'+lk.length+' entries</span></div></div>'
      +'<div class="ec-stats">'
      +'<div class="ec-stat"><div class="esv" style="color:#6C63FF">'+rs(rc)+'</div><div class="esl">Received</div></div>'
      +'<div class="ec-stat"><div class="esv" style="color:#A855F7">'+rs(gv)+'</div><div class="esl">Given</div></div>'
      +'<div class="ec-stat"><div class="esv" style="color:'+(net>=0?'#22c55e':'#e53e3e')+'">'+(net>=0?'+':'')+rs(net)+'</div><div class="esl">Net</div></div>'
      +'</div><div class="ec-body" id="ecb-'+v.id+'">'
      +(lk.length?lk.sort(function(a,b){return new Date(b.d)-new Date(a.d);}).map(function(e){
        return '<div class="pc-row"><div class="pc-row-left">'+e.n+(e.o?' &middot; '+e.o:'')+' &middot; '+fd(e.d)
          +' <span class="badge '+(e.t==='Received'?'recv':'give')+'">'+e.t+'</span></div>'
          +'<div class="pc-row-right" style="color:'+(e.t==='Received'?'#6C63FF':'#A855F7')+'">'+rs(e.a)+'</div></div>';
      }).join(''):'<div class="pc-row" style="color:#ccc">No entries linked yet</div>')
      +'</div></div>';
  }).join('');
}

function setLF(f,btn){lf=f;document.querySelectorAll('#lfc .chip').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');rLog();}
function setLS(s,btn){ls=s;document.querySelectorAll('#lsc .chip').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');rLog();}

function rLog(){
  var q=(document.getElementById('log-q').value||'').toLowerCase();
  var list=[].concat(E);
  if(lf!=='all')list=list.filter(function(e){return e.t===lf;});
  if(q)list=list.filter(function(e){
    return e.n.toLowerCase().includes(q)||(e.o||'').toLowerCase().includes(q)
      ||(V.find(function(v){return v.id===e.ev;})||{n:''}).n.toLowerCase().includes(q);
  });
  if(ls==='newest')list.sort(function(a,b){return new Date(b.d)-new Date(a.d);});
  else if(ls==='oldest')list.sort(function(a,b){return new Date(a.d)-new Date(b.d);});
  else if(ls==='high')list.sort(function(a,b){return b.a-a.a;});
  else list.sort(function(a,b){return a.a-b.a;});
  var el=document.getElementById('log-list');
  el.innerHTML=list.length?list.map(function(e){return ecard(e,false);}).join(''):'<div class="empty"><div class="empty-icon">&#128269;</div><p>No entries found</p></div>';
}

function setPS(s,btn){ps=s;document.querySelectorAll('#psc .chip').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');rPeople();}

function rPeople(){
  var q=(document.getElementById('ppl-q').value||'').toLowerCase();
  var map={};
  E.forEach(function(e){
    var k=e.n.toLowerCase().trim();
    if(!map[k])map[k]={n:e.n,r:e.r||'',recv:0,give:0,cnt:0,items:[]};
    if(e.t==='Received')map[k].recv+=e.a;else map[k].give+=e.a;
    map[k].cnt++;map[k].items.push(e);
  });
  var list=Object.values(map);
  if(q)list=list.filter(function(p){return p.n.toLowerCase().includes(q);});
  if(ps==='recv')list.sort(function(a,b){return b.recv-a.recv;});
  else if(ps==='give')list.sort(function(a,b){return b.give-a.give;});
  else if(ps==='net')list.sort(function(a,b){return(b.recv-b.give)-(a.recv-a.give);});
  else list.sort(function(a,b){return b.cnt-a.cnt;});
  var el=document.getElementById('ppl-list');
  if(!list.length){el.innerHTML='<div class="empty"><div class="empty-icon">&#128101;</div><p>No people yet</p></div>';return;}
  el.innerHTML=list.map(function(p,i){
    var net=p.recv-p.give;
    return '<div class="pcard"><div class="pc-head" onclick="tog(\'pb-'+i+'\')">'
      +'<div><div class="pc-name">'+p.n+'</div><div class="pc-rel">'+(p.r?p.r+' &middot; ':'')+p.cnt+' time'+(p.cnt>1?'s':'')+'</div></div>'
      +'<div><div class="pc-net" style="color:'+(net>=0?'#22c55e':'#e53e3e')+'">'+(net>=0?'+':'')+rs(net)+'</div></div></div>'
      +'<div class="pc-body" id="pb-'+i+'"><div class="pc-totals">'
      +'<div class="pc-tot"><div class="ptv" style="color:#6C63FF">'+rs(p.recv)+'</div><div class="ptl">Received</div></div>'
      +'<div class="pc-tot"><div class="ptv" style="color:#A855F7">'+rs(p.give)+'</div><div class="ptl">Given</div></div>'
      +'</div>'
      +p.items.sort(function(a,b){return new Date(b.d)-new Date(a.d);}).map(function(e){
        var ev=V.find(function(v){return v.id===e.ev;});
        return '<div class="pc-row"><div class="pc-row-left">'+(e.o||'No occasion')+(ev?' &middot; '+ev.n:'')+' &middot; '+fd(e.d)
          +' <span class="badge '+(e.t==='Received'?'recv':'give')+'">'+e.t+'</span></div>'
          +'<div class="pc-row-right" style="color:'+(e.t==='Received'?'#6C63FF':'#A855F7')+'">'+rs(e.a)+'</div></div>';
      }).join('')
      +'</div></div>';
  }).join('');
}

function openAdd(){
  document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
  ['f-name','f-rel','f-occ','f-amt','f-notes'].forEach(function(id){document.getElementById(id).value='';});
  var sel=document.getElementById('f-ev');
  sel.innerHTML='<option value="">-- None --</option>';
  V.forEach(function(v){sel.innerHTML+='<option value="'+v.id+'">'+v.n+'</option>';});
  setType('Received');
  document.getElementById('add-overlay').classList.add('show');
}

function setType(t){
  cType=t;
  document.getElementById('tt-recv').className='tt-btn'+(t==='Received'?' recv':'');
  document.getElementById('tt-give').className='tt-btn'+(t==='Given'?' give':'');
  document.getElementById('fl-person').innerHTML=(t==='Received'?'Received From':'Given To')+' <span class="req">*</span>';
}

function saveEntry(){
  var n=document.getElementById('f-name').value.trim();
  var a=document.getElementById('f-amt').value;
  if(!n||!a){toast('Name and amount are required');return;}
  var d=document.getElementById('f-date').value;
  E.push({
    id:Date.now().toString(),t:cType,
    d:d||new Date().toISOString().split('T')[0],
    o:document.getElementById('f-occ').value.trim(),
    a:Number(a),n:n,
    r:document.getElementById('f-rel').value.trim(),
    nt:document.getElementById('f-notes').value.trim(),
    ev:document.getElementById('f-ev').value||null
  });
  save();closeSheet('add-overlay');toast('Sagan saved!');rHome();
}

function openCreateEvent(){
  document.getElementById('ev-date').value=new Date().toISOString().split('T')[0];
  ['ev-name','ev-type','ev-notes'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('ev-overlay').classList.add('show');
}

function saveEvent(){
  var n=document.getElementById('ev-name').value.trim();
  var d=document.getElementById('ev-date').value;
  if(!n||!d){toast('Name and date required');return;}
  V.push({id:'v'+Date.now(),n:n,d:d,tp:document.getElementById('ev-type').value.trim()||'Event',nt:document.getElementById('ev-notes').value.trim()});
  save();closeSheet('ev-overlay');toast('Event created!');rEvents();
}

function del(id){
  if(!confirm('Delete this entry?'))return;
  E=E.filter(function(e){return e.id!==id;});
  save();rLog();toast('Deleted');
}

function closeSheet(id){document.getElementById(id).classList.remove('show');}
function bgClose(e,id){if(e.target.id===id)closeSheet(id);}

function openSettings(){
  updateBackupStatus();
  document.getElementById('set-overlay').classList.add('show');
}

function updateBackupStatus(){
  var dot=document.getElementById('backup-dot');
  var txt=document.getElementById('backup-text');
  if(!lastBackup){dot.className='backup-dot';txt.textContent='No backup yet - back up your data!';return;}
  var days=Math.floor((Date.now()-Number(lastBackup))/86400000);
  if(days===0){dot.className='backup-dot fresh';txt.textContent='Last backed up today';}
  else if(days<=7){dot.className='backup-dot fresh';txt.textContent='Last backed up '+daysAgo(lastBackup);}
  else{dot.className='backup-dot old';txt.textContent='Last backup '+daysAgo(lastBackup)+' - please back up!';}
}

function shareBackup(){
  var data=JSON.stringify({entries:E,events:V},null,2);
  var filename='sagan-backup-'+new Date().toISOString().split('T')[0]+'.json';
  if(navigator.share&&navigator.canShare){
    var file=new File([data],filename,{type:'application/json'});
    if(navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Sagan Tracker Backup',text:'My Sagan Tracker backup - '+filename})
        .then(function(){
          lastBackup=Date.now().toString();
          localStorage.setItem('sg_lastbackup',lastBackup);
          updateBackupStatus();
          toast('Backup shared!');
        })
        .catch(function(){});
      return;
    }
  }
  // Fallback to download if share not supported
  exportData();
}

function exportData(){
  var b=new Blob([JSON.stringify({entries:E,events:V},null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='sagan-backup-'+new Date().toISOString().split('T')[0]+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},1000);
  lastBackup=Date.now().toString();
  localStorage.setItem('sg_lastbackup',lastBackup);
  updateBackupStatus();
  toast('Backup downloaded');
}

function onFile(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{imp=JSON.parse(ev.target.result);document.getElementById('set-btns').style.display='none';document.getElementById('set-confirm').style.display='block';}
    catch(err){toast('Invalid file');}
  };
  r.readAsText(f);e.target.value='';
}

function doImport(){
  if(!imp)return;
  E=imp.entries||[];V=imp.events||[];
  save();toast('Data imported!');cancelImport();closeSheet('set-overlay');rHome();
}

function cancelImport(){
  imp=null;
  document.getElementById('set-confirm').style.display='none';
  document.getElementById('set-btns').style.display='block';
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

rHome();
</script>
</body>
</html>
